name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install mkdocs-material==9.7.7

    - name: Build the docs under /documents/site/
      run: |
        mkdocs build -d site/documents/site

    - name: Publish the network app at the root
      run: |
        cp -R app/index.html app/styles.css app/favicon.svg app/src app/assets app/docs app/research app/data site/
        cp site/documents/site/404.html site/404.html
        cp site/documents/site/CNAME site/CNAME

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
